<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi asistencia - Semana de Matemáticas</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Flexbox en el body para que el footer siempre se quede hasta abajo */
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
  }
  main {
    flex: 1; /* Hace que el main ocupe todo el espacio disponible */
  }
  .app-header {
    background-color: #003b5c; /* Azul UNISON */
    color: white;
    text-align: center;
    padding: 1.5rem 1rem;
    border-bottom: 4px solid #f2a900; /* Amarillo UNISON */
  }
  .app-header h2 { margin: 0; font-size: 1.5rem; }
  .app-header p { margin: 5px 0 0 0; opacity: 0.9; }
  .app-footer {
    text-align: center;
    padding: 1rem;
    font-size: 0.85rem;
    color: #666;
    background-color: #f4f7f6;
  }
</style>
</head>
<body>

<!-- ENCABEZADO -->
<header class="app-header">
  <h2>Semana de Matemáticas</h2>
  <p>Universidad de Sonora</p>
</header>

<main>
  <section id="login" class="card hidden">
    <h1>Mi asistencia</h1>
    <p class="sub">Entra con tu expediente y el NIP que te dio tu administrador.</p>
    <form id="loginForm">
      <input id="exp" placeholder="Expediente" autocomplete="username" autocapitalize="characters" required>
      <input id="nip" type="password" inputmode="numeric" placeholder="NIP" autocomplete="current-password" required>
      <div class="row"><button class="primary">Entrar</button></div>
    </form>
    <div class="msg err" id="lmsg"></div>
  </section>

  <div id="panel" class="hidden">
    <div class="card">
      <h1 id="who"></h1>
      <div class="big" id="expLabel"></div>
      <div class="row noprint">
        <button class="primary" id="qrBtn">Mostrar mi QR</button>
        <button id="printBtn">Imprimir mi expediente</button>
        <button id="logout">Salir</button>
      </div>
    </div>
    <div class="card qrbox" id="qrBox"><div class="label">Mi código QR</div><img id="qrImg" alt="Mi código QR"></div>
      <div class="label">Mis cursos y faltas</div>
      <table id="tbl"></table>
      <div class="msg" id="empty"></div>
    </div>
  </div>
</main>

<!-- PIE DE PÁGINA -->
<footer class="app-footer">
  <p>&copy; 2026 SPEED-BUG. Todos los derechos reservados.</p>
</footer>

<script src="usuario.js"></script>
</body>
</html>
